<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درب العراق | Darb Iraq</title>
<meta name="theme-color" content="#0b5d3b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map" aria-label="map"></div>

<header class="top">
  <div class="search" role="search">
    <span class="brand">درب</span>
    <input id="q" type="search" disabled data-i18n-ph="search_ph" autocomplete="off">
    <button id="btnLang" class="chip" aria-label="Language">EN</button>
    <button id="btnTheme" class="chip" aria-label="Theme">◐</button>
  </div>
  <div class="status">
    <span id="gps" class="pill gps-off"><i></i><b data-i18n="gps_off"></b></span>
    <span id="net" class="pill net-on"><i></i><b data-i18n="online"></b></span>
  </div>
</header>

<div class="fabs">
  <button id="btnLocate" class="fab primary" data-i18n-title="locate" title="">⌖</button>
  <button id="btnCenter" class="fab" data-i18n-title="center" title="">⌂</button>
  <button id="btnLayers" class="fab" data-i18n-title="layers" title="">≣</button>
</div>

<section id="card" class="card">
  <div class="grab"></div>
  <h2 data-i18n="card_title"></h2>
  <p data-i18n="card_body"></p>
  <button class="cta" id="btnStart" data-i18n="start"></button>
</section>

<nav class="bottom">
  <button class="on"><span>🗺</span><b data-i18n="nav_map"></b></button>
  <button data-soon><span>📍</span><b data-i18n="nav_near"></b></button>
  <button data-soon><span>⚠</span><b data-i18n="nav_reports"></b></button>
  <button data-soon><span>✦</span><b data-i18n="nav_ai"></b></button>
</nav>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
